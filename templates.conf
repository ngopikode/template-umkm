server {
    listen 80;
    server_name templates.ngopikode.space;

    root /var/www/templates-ngopikode/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
